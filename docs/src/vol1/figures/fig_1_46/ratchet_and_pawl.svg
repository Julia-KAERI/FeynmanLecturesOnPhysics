<rect x="28" y="28" width="1184" height="764" fill="none" stroke="#22252A" stroke-width="1.4"/>
<text x="60" y="88" font-size="40" font-weight="bold">톱니바퀴와 멈춤쇠</text>
<text x="60" y="118" font-size="16" fill="#7E7C74">Ratchet and pawl. Feynman Lectures on Physics, Vol. I, Ch. 46. 제2법칙을 부품 단위로 검산하기.</text>
<line x1="60" y1="134" x2="1180" y2="134" stroke="#22252A" stroke-width="1"/>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7E7C74"/></marker></defs>
<g><rect x="70" y="300" width="190" height="190" fill="none" stroke="#B23A2B" stroke-width="2.2"/><text x="70" y="288" font-size="17" fill="#B23A2B" font-weight="bold">기체 T₁</text><text x="260" y="288" font-size="13" fill="#B23A2B" text-anchor="end">날개를 두드리는 쪽</text><circle cx="231.0" cy="378.0" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="180.1" cy="456.2" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="118.9" cy="397.7" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="179.2" cy="471.0" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="85.5" cy="321.7" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="134.4" cy="450.3" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="223.3" cy="333.0" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="236.3" cy="399.7" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="244.5" cy="468.9" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="95.8" cy="475.6" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="161.4" cy="336.5" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="159.2" cy="322.6" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="207.3" cy="402.6" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="98.6" cy="348.5" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="166.1" cy="442.3" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="126.8" cy="328.1" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="140.3" cy="321.7" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="137.0" cy="458.2" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="111.2" cy="361.3" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="211.4" cy="344.6" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="99.5" cy="352.2" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="195.0" cy="321.0" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="128.3" cy="329.7" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="207.7" cy="406.7" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="179.0" cy="339.2" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="172.2" cy="321.2" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="97.1" cy="455.9" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="109.6" cy="310.2" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="201.7" cy="341.5" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="239.8" cy="313.9" r="2.4" fill="#B23A2B" opacity="0.85"/><circle cx="190.4" cy="316.0" r="2.4" fill="#B23A2B" opacity="0.85"/><line x1="103.0" y1="395.0" x2="227.0" y2="395.0" stroke="#22252A" stroke-width="5" stroke-linecap="round"/><line x1="121.2" y1="351.2" x2="208.8" y2="438.8" stroke="#22252A" stroke-width="5" stroke-linecap="round"/><line x1="165.0" y1="333.0" x2="165.0" y2="457.0" stroke="#22252A" stroke-width="5" stroke-linecap="round"/><line x1="208.8" y1="351.2" x2="121.2" y2="438.8" stroke="#22252A" stroke-width="5" stroke-linecap="round"/><circle cx="165.0" cy="395.0" r="7" fill="#22252A"/><line x1="165.0" y1="395.0" x2="430" y2="395.0" stroke="#22252A" stroke-width="6"/><circle cx="330" cy="395.0" r="14" fill="#EAE3CF" stroke="#22252A" stroke-width="2.5"/><line x1="330" y1="409.0" x2="330" y2="520.0" stroke="#22252A" stroke-width="1.6"/><rect x="310" y="520.0" width="40" height="34" fill="#22252A"/><text x="330" y="544.0" font-size="18" fill="#EAE3CF" text-anchor="middle" font-style="italic">L</text><text x="360" y="547.0" font-size="13" fill="#7E7C74">들어올릴 부하</text><path d="M512.0,395.0 L497.9,398.6 L503.9,430.6 L489.6,427.7 L481.1,459.1 L469.6,450.3 L448.2,474.9 L441.6,462.0 L411.8,474.9 L411.4,460.4 L378.9,459.1 L384.9,445.9 L356.1,430.6 L367.3,421.3 L348.0,395.0 L362.1,391.4 L356.1,359.4 L370.4,362.3 L378.9,330.9 L390.4,339.7 L411.8,315.1 L418.4,328.0 L448.2,315.1 L448.6,329.6 L481.1,330.9 L475.1,344.1 L503.9,359.4 L492.7,368.7 Z" fill="#EAE3CF" stroke="#22252A" stroke-width="2.6" stroke-linejoin="round"/><circle cx="430" cy="395.0" r="9" fill="#22252A"/><path d="M 538,435.0 A 112 112 0 0 0 538,355.0" fill="none" stroke="#7E7C74" stroke-width="1.8" marker-end="url(#ah)"/><text x="552" y="399.0" font-size="13" fill="#7E7C74">앞으로</text><path d="M500,260.0 L510,268.0 L441.0,317.0 L432.0,324.0 L494,266.0 Z" fill="#2B6B8F" stroke="#22252A" stroke-width="1.6" stroke-linejoin="round"/><circle cx="500" cy="260.0" r="6" fill="#EAE3CF" stroke="#22252A" stroke-width="2"/><path d="M472.0,281.5 L479.0,274.5 L465.0,260.5 L479.0,246.5 L465.0,232.5 L479.0,218.5 L465.0,204.5 L479.0,190.5 L472.0,169.5" fill="none" stroke="#2B6B8F" stroke-width="2"/><line x1="454.0" y1="167.5" x2="490.0" y2="167.5" stroke="#22252A" stroke-width="3"/><text x="498.0" y="221.5" font-size="17" fill="#2B6B8F" font-weight="bold">멈춤쇠 T₂</text><text x="498.0" y="241.5" font-size="13" fill="#2B6B8F">이놈도 열운동을 한다</text><text x="522" y="300.0" font-size="15" fill="#22252A" font-style="italic">ε</text><text x="534" y="300.0" font-size="12" fill="#7E7C74">멈춤쇠를 들 에너지</text></g>
<text x="70" y="560" font-size="13" fill="#7E7C74">Fig. 46. 날개는 T₁ 기체 속, 톱니바퀴와 멈춤쇠는 T₂. 축에 부하 L. 한 칸 회전각 θ.</text>
<text x="640" y="178" font-size="19" fill="#B23A2B"  font-weight="bold">앞으로 한 칸</text>
<text x="640" y="202" font-size="15" fill="#22252A"  >T₁ 기체의 요동이 날개를 밀어 멈춤쇠를 넘긴다. 빌려야 할 에너지는 ε + Lθ.</text>
<text x="658" y="236" font-size="21" fill="#B23A2B" font-style="italic">r₊ <tspan font-style="normal">∝</tspan> (1/τ)·e<tspan dy="-9" font-size="14">−(ε+Lθ)/kT₁</tspan></text>
<text x="640" y="288" font-size="19" fill="#2B6B8F"  font-weight="bold">뒤로 한 칸</text>
<text x="640" y="312" font-size="15" fill="#22252A"  >T₂ 멈춤쇠가 스스로 들려 톱니가 미끄러진다. 빌려야 할 에너지는 ε 뿐.</text>
<text x="658" y="346" font-size="21" fill="#2B6B8F" font-style="italic">r₋ <tspan font-style="normal">∝</tspan> (1/τ)·e<tspan dy="-9" font-size="14">−ε/kT₂</tspan></text>
<line x1="640" y1="390" x2="1180" y2="390" stroke="#22252A" stroke-width="0.8"/>
<text x="640" y="424" font-size="19" fill="#22252A"  font-weight="bold">결산</text>
<text x="640" y="452" font-size="16" fill="#22252A"  >T₁ = T₂, L = 0  →  r₊ = r₋. 알짜 회전 0. 제2법칙 무사.</text>
<text x="640" y="478" font-size="16" fill="#B23A2B"  >T₁ > T₂  →  앞으로 돈다. 열기관.</text>
<text x="640" y="504" font-size="16" fill="#2B6B8F"  >T₁ &lt; T₂  →  뒤로 돈다. 냉동기.</text>
<text x="640" y="536" font-size="16" fill="#22252A"  >가역 조건 r₊ = r₋ 에서  (ε+Lθ)/T₁ = ε/T₂</text>
<text x="640" y="570" font-size="21">효율 = <tspan font-style="italic">Lθ</tspan>/(<tspan font-style="italic">ε</tspan>+<tspan font-style="italic">Lθ</tspan>) = (T₁ − T₂)/T₁<tspan fill="#7E7C74" font-size="15">   그대로 Carnot.</tspan></text>
<rect x="60" y="630" width="1120" height="70" fill="none" stroke="#22252A" stroke-width="1.2"/>
<text x="620.0" y="660" font-size="20" text-anchor="middle">멈춤쇠에도 온도가 있다는 걸 인정하는 순간, 도깨비는 사라지고 평범한 Carnot 기관 하나가 남는다.</text>
<text x="620.0" y="686" font-size="14" text-anchor="middle" fill="#7E7C74">Smoluchowski 1912, Feynman 1962. 그리고 30년 뒤 세포 속 분자 모터의 설계도가 된 그림.</text>
<text x="60" y="750" font-size="13" fill="#7E7C74">제리의 파인만 읽기, 2026년 9월. 아이린과 함께.</text>
<text x="1180" y="750" font-size="13" fill="#7E7C74" text-anchor="end">한 칸도 공짜로는 안 돈다.</text>
</svg>